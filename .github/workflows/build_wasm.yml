name: 'Build: Wasm'

on:
  # pull_request:   At the moment disabled for pull_request
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode: devel, nightly, testing, stable'
        default: 'devel'
        required: true
      publish_web_build:
        description: 'Publish the build to musescore/mss_web_builds (main repository only)'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      build_mode:
        description: 'Build mode: devel, nightly, testing, stable'
        default: 'devel'
        type: string
        required: true
      publish_web_build:
        description: 'Publish the build to musescore/mss_web_builds (main repository only)'
        required: false
        type: boolean
        default: false

concurrency:
  # If run via workflow_call, ${{ github.workflow }} is the root workflow's name (e.g. 'Deploy'),
  # which is the same for all workflows called in that run, hence we must add a unique suffix here.
  group: ${{ github.workflow }} ${{ github.event_name }} ${{ github.ref }} wasm
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      upload_artifact_name: ${{ steps.configure.outputs.UPLOAD_ARTIFACT_NAME }}
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Configure workflow
      id: configure
      env:
        pull_request_title: ${{ github.event.pull_request.title }}
      run: |
        bash ./buildscripts/ci/tools/make_build_mode_env.sh -e ${{ github.event_name }} -m ${{ inputs.build_mode }}
        BUILD_MODE=$(cat ./build.artifacts/env/build_mode.env)

        bash ./buildscripts/ci/tools/make_build_number.sh
        BUILD_NUMBER=$(cat ./build.artifacts/env/build_number.env)

        ADD_INFO="_${GITHUB_REF#refs/heads/}"
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          ADD_INFO="_${{ github.event.pull_request.number }}_${pull_request_title}"
        fi
        UPLOAD_ARTIFACT_NAME="$(tr '":<>|*?/\\’' '_' <<<"MU4_${BUILD_NUMBER}_Wasm${ADD_INFO}")"

        echo "github.repository: ${{ github.repository }}"
        echo "BUILD_MODE=$BUILD_MODE" | tee -a $GITHUB_ENV
        echo "BUILD_NUMBER=$BUILD_NUMBER" | tee -a $GITHUB_ENV
        echo "UPLOAD_ARTIFACT_NAME=$UPLOAD_ARTIFACT_NAME" | tee -a $GITHUB_ENV $GITHUB_OUTPUT

    - parallel:
      - name: Restore ccache files
        id: restore-ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: wasm-ccache-
          restore-keys: wasm-ccache-
      - name: Setup ccache
        run: |
          sudo apt-get install -y ccache
          bash ./muse/buildscripts/ci/tools/setup_ccache_config.sh

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.11.2
        host: all_os
        target: 'wasm'
        arch: wasm_singlethread
        modules: 'qt5compat qtshadertools qtwebsockets'
        cache: true

    - name: Setup environment
      run: |
        bash ./buildscripts/ci/linux/setup.sh --arch wasm

    - name: Register gcc problem matcher
      run: echo "::add-matcher::.github/problem_matchers/gcc.json"

    - name: Build
      env:
        CMAKE_PREFIX_PATH: ${{env.QT_ROOT_DIR}}
      run: |
        bash ./buildscripts/ci/wasm/build.sh -n ${{ env.BUILD_NUMBER }}
    - name: Show ccache stats
      run: |
        ccache -sv
    - name: Package
      run: |
        bash ./buildscripts/ci/wasm/package.sh
    - name: Upload artifacts on GitHub
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.UPLOAD_ARTIFACT_NAME }}
        path: ./build.artifacts/

    - name: Prepare ccache files for saving
      id: prepare-save-ccache
      if: always()
      run: |
        ccache --recompress 10
        echo "CCACHE_TIMESTAMP=$(date -u +"%F-%T")" | tee -a $GITHUB_OUTPUT
    - name: Save ccache files
      if: always()
      uses: actions/cache/save@v6
      with:
        key: ${{ steps.restore-ccache.outputs.cache-primary-key }}${{ steps.prepare-save-ccache.outputs.CCACHE_TIMESTAMP }}
        path: ${{ github.workspace }}/.ccache

  publish:
    needs: build
    if: github.repository == 'musescore/MuseScore' && inputs.publish_web_build
    runs-on: ubuntu-24.04
    # Publishes from any ref push to the same repository and branch, so they go one at a time
    concurrency:
      group: publish web build musescore/mss_web_builds main
      cancel-in-progress: false
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: ${{ needs.build.outputs.upload_artifact_name }}
        path: ./build.artifacts/
    - name: Publish web build
      env:
        DEPLOY_KEY: ${{ secrets.WEB_BUILDS_DEPLOY_KEY }}
      run: |
        KEY_FILE="${RUNNER_TEMP}/web_builds_deploy_key"
        echo "${DEPLOY_KEY}" > "${KEY_FILE}"
        chmod 600 "${KEY_FILE}"
        export GIT_SSH_COMMAND="ssh -i ${KEY_FILE} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

        cmake -P ./muse/buildscripts/ci/wasm/publish_web_build.cmake \
          --repo_url git@github.com:musescore/mss_web_builds.git \
          --branch main \
          --build_dir build.artifacts \
          --target_dir app \
          --exclude env \
          --exclude run_server.sh \
          --build_version "$(cat ./build.artifacts/env/build_version.env)"

        rm -f "${KEY_FILE}"

        echo "Web build: https://musescore.github.io/mss_web_builds/" | tee -a $GITHUB_STEP_SUMMARY
