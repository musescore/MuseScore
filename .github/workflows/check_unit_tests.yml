name: 'Check: Unit Tests (utest)'

on:
  pull_request:
  workflow_dispatch:
    inputs:
      code_coverage:
        description: 'Enable code coverage'
        required: false
        type: boolean
        default: false
      publish_coverage_report:
        description: 'Publish code coverage report and badge to musescore/mss_code_coverage (main repository only)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 3 * * 4" # Every Thursday night at 03:00 for master branch

concurrency:
  group: ${{ github.workflow }} ${{ github.event_name }} ${{ github.ref }}
  cancel-in-progress: true

jobs:
  run_tests:
    runs-on: ubuntu-24.04
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: "Configure workflow"
      run: |
        bash ./buildscripts/ci/tools/make_build_number.sh
        BUILD_NUMBER=$(cat ./build.artifacts/env/build_number.env)

        echo "BUILD_NUMBER=$BUILD_NUMBER" | tee -a $GITHUB_ENV

    - parallel:
      - name: Restore ccache files
        id: restore-ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{runner.os}}-${{runner.arch}}-utests-ccache-
          restore-keys: |
            ${{runner.os}}-${{runner.arch}}-utests-ccache-
      - name: Setup ccache
        run: |
          sudo apt-get install -y ccache
          bash ./muse/buildscripts/ci/tools/setup_ccache_config.sh

    - name: Free up disk space
      background: true
      run: |
        sudo docker system prune -a -f
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc /usr/local/.ghcup
        sudo rm -rf /usr/share/swift
        sudo rm -rf /opt/hostedtoolcache/CodeQL

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.11.2
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: 'qt5compat qtnetworkauth qtshadertools qtwebsockets'
        cache: true
    - name: Setup environment
      run: |
        bash ./buildscripts/ci/linux/setup.sh

    - name: Build
      env:
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        CODE_COVERAGE: ${{ inputs.code_coverage }}
      run: |
        mkdir -p build.artifacts/env

        ENABLE_CODE_COVERAGE='false'

        if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$CODE_COVERAGE" == true ]]; then
          ENABLE_CODE_COVERAGE='true'
        else
          ENABLE_CODE_COVERAGE='false'
        fi

        bash ./buildscripts/ci/linux/build_utest.sh -n ${{ env.BUILD_NUMBER }} --enable_code_coverage ${ENABLE_CODE_COVERAGE}

    - name: Show ccache stats
      run: |
        ccache -sv
    - name: Run tests
      run: |
        bash ./buildscripts/ci/linux/runutests.sh
      env:
        ASAN_OPTIONS: "detect_leaks=0"

    - name: Code coverage
      if: github.event_name == 'schedule' || inputs.code_coverage
      run: |
        # Zero baseline from .gcno files, so that compiled code which no test runs is counted as uncovered
        lcov --capture --initial --directory "$(pwd)/build.debug/" --output-file coverage_base.info --ignore-errors mismatch,inconsistent,gcov,negative
        lcov --capture --directory "$(pwd)/build.debug/" --output-file coverage_tests.info --ignore-errors mismatch,inconsistent,gcov,negative
        lcov --add-tracefile coverage_base.info --add-tracefile coverage_tests.info --output-file coverage.info --ignore-errors mismatch,inconsistent,negative

        lcov --remove coverage.info '/usr/*' '*/tests/*' '*/thirdparty/*' '*/moc_*' '*framework/Headers/*' '*.framework/*' '*/hb-*' '*/Qt/*' '*/build.debug/*' '*/framework/testing/*' '*/devtools/*' --output-file filtered_coverage.info --ignore-errors unused

        SUMMARY=$(lcov --summary filtered_coverage.info --ignore-errors inconsistent,corrupt,unsupported,empty,negative,mismatch,gcov)
        COVERAGE=$(echo "${SUMMARY}" | grep -oP 'lines\.+:\s+\K[0-9.]+')
        FUNCTIONS_COVERAGE=$(echo "${SUMMARY}" | grep -oP 'functions\.+:\s+\K[0-9.]+' || echo "?")
        python3 muse/buildscripts/ci/linux/tools/lcov_badger.py "${COVERAGE}" coverage_badge.svg

        echo "### Code coverage: ${COVERAGE}% of lines, ${FUNCTIONS_COVERAGE}% of functions" | tee -a $GITHUB_STEP_SUMMARY
        echo "COVERAGE=${COVERAGE}" >> $GITHUB_ENV
        echo "FUNCTIONS_COVERAGE=${FUNCTIONS_COVERAGE}" >> $GITHUB_ENV

        # Without per-file function pages and extra sorted index pages: they make up about a third of the report
        genhtml filtered_coverage.info --output-directory coverage_report --no-function-coverage --no-sort --ignore-errors inconsistent,corrupt,unsupported,empty,negative,mismatch,source || true

    - name: Upload coverage report
      if: github.event_name == 'schedule' || inputs.code_coverage
      uses: actions/upload-artifact@v7
      with:
        name: code_coverage_report
        path: |
          filtered_coverage.info
          coverage_badge.svg
          coverage_report/

    - name: Publish coverage report
      if: github.repository == 'musescore/MuseScore' && ( github.event_name == 'schedule' || ( inputs.code_coverage && inputs.publish_coverage_report ) )
      env:
        DEPLOY_KEY: ${{ secrets.CODE_COVERAGE_DEPLOY_KEY }}
      run: |
        KEY_FILE="${RUNNER_TEMP}/code_coverage_deploy_key"
        echo "${DEPLOY_KEY}" > "${KEY_FILE}"
        chmod 600 "${KEY_FILE}"
        export GIT_SSH_COMMAND="ssh -i ${KEY_FILE} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

        bash ./muse/buildscripts/ci/tools/publish_code_coverage.sh \
          --repo_url git@github.com:musescore/mss_code_coverage.git \
          --branch main \
          --report_dir coverage_report \
          --badge coverage_badge.svg \
          --lines "${COVERAGE}" \
          --functions "${FUNCTIONS_COVERAGE}"

        rm -f "${KEY_FILE}"

        echo "Report: https://musescore.github.io/mss_code_coverage/" | tee -a $GITHUB_STEP_SUMMARY

    - name: Prepare ccache files for saving
      id: prepare-save-ccache
      if: always()
      run: |
        ccache --recompress 10
        echo "CCACHE_TIMESTAMP=$(date -u +"%F-%T")" | tee -a $GITHUB_OUTPUT
    - name: Save ccache files
      if: always()
      uses: actions/cache/save@v6
      with:
        key: ${{ steps.restore-ccache.outputs.cache-primary-key }}${{ steps.prepare-save-ccache.outputs.CCACHE_TIMESTAMP }}
        path: ${{ github.workspace }}/.ccache
